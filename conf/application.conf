include "backend.conf"

# This is the main configuration file for the application.
# ~~~~~

appName = agent-services-account

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

# Play Modules
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"

# Provides an instance of Crypto for field-level encryption
play.modules.enabled += "uk.gov.hmrc.agentservicesaccount.modules.CryptoProviderModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.internalauth.client.modules.InternalAuthModule"



# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# !!!WARNING!!! DO NOT CHANGE THIS ROUTER
play.http.router = prod.Routes

# Microservice specific config

metrics {
  enabled = false
}

auditing {
  enabled = false
}

fieldLevelEncryption {
  enable = true
  key = "0xbYzrPV9/GmVEGazywGswm7yRYoWy2BraeJnjOUgcY="
  previousKeys = []
}

mongodb {
  uri = "mongodb://localhost:27017/agent-services-account"
  timeToLive = 900 # set to 15 minutes locally 
}

microservice {
  services {

    auth {
      host = localhost
      port = 8500
    }

    internal-auth {
      protocol = http
      host = localhost
      port = 8470
    }

    citizen-details {
      host = localhost
      port = 9337
    }

    des {
      host = localhost
      port = 9904
      environment = test
      authorization-token = secret
    }
    
    dms-submission {
      protocol = http
      host = localhost
      port = 9009
      contact-details-submission {
        callbackEndpoint = "dms-agent-callback"
        businessArea = "ISBC"
        classificationType = "ISBC-ACT-Queue 1"
        customerId = "ARN"
        formId = "AGENTCONDTS"
        source = "ARN"
      }
    }

    self {
      protocol = http
      host = localhost
      port = 9402
    }
      
    email {
      host = localhost
      port = 8300
    }
    
    agent-assurance {
      host = localhost
      port = 9565
    }
  }
}

stride.roles.agent-services-account = "maintain_agent_manually_assure"
agent.entity.cache.enabled = true
agent.entity.cache.expires = 15 minutes
agent.entity-check.lock.expires = 24 hours
agent.entity-check.email.lock.expires = 7 days
agent-maintainer-email = "test@example.com"
internalServiceHostPatterns = ["^.*\\.service$","^.*\\.mdtp$","^localhost$"]

internal-auth.token = "YWdlbnQtYXNzdXJhbmNl" ##base64: agent_assurance
internal-auth-token-enabled-on-start = false


